<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/@vonage/client-sdk@latest/dist/vonageClientSDK.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        spacing: {
          '1': '8px',
          '2': '12px'
        }
      }
    }
  </script>
  <script type="text/javascript">
    let phone = '';
    let btnCall;
    let btnInvite;
    let btnHangup;
    let btnHold;
    let btnTransfer;
    let inputTransfer;
    let currentCall;
    let currentLegId;
    let userId = '';
    const client = new vonageClientSDK.VonageClient();
    const ringtone = new Audio('./ringtone.mp3');

    window.onerror = function(msg, url, line, col, error) {
      console.error(`❌ Global Error: ${msg} at ${line}:${col}`);
      alert(`JavaScriptエラー: ${msg} (Line: ${line})`);
      return false;
    };

    window.onload = async () => {
      console.log(`🐞 window.onload started.`);
      btnCall = document.getElementById('btnCall');
      btnInvite = document.getElementById('btnInvite');
      btnHangup = document.getElementById('btnHangup');
      btnHold = document.getElementById('btnHold');
      btnTransfer = document.getElementById('btnTransfer');
      inputTransfer = document.getElementById('inputTransfer');

      try {
        let params = new URLSearchParams(decodeURI(location.search));
        params.forEach((value, key) => {
          if (key === 'userId') userId = value;
          if (key === 'phone') {
            phone = value.charAt(0) === '0' ? '+81' + value.slice(1) : value;
            btnCall.disabled = false;
            btnCall.innerHTML = '発信';
            btnCall.hidden = false;
          }
        });

        if (!userId) {
          throw new Error('URLパラメータ "userId" が見つかりません。');
        }

        console.log(`🐞 Fetching token for ${userId}...`);
        const response = await fetch(`./getToken?name=${userId}`);
        if (!response.ok) throw new Error(`トークン取得失敗: ${response.status}`);
        const data = await response.json();
        const jwt = data.jwt;

        console.log("🐞 Registering event listeners...");

        client.on('legStatusUpdate', (callId, legId, status) => {
          console.log(`🐞 [Event] legStatusUpdate: ${status}, legId: ${legId}`);
          if (client.session && client.session.legs && client.session.legs[legId]) {
              currentLegId = legId;
          }

          if (status === 'RINGING') {
            btnCall.hidden = true;
            btnHangup.innerHTML = '呼び出し中...';
            btnHangup.hidden = false;
          } else if (status === 'ANSWERED') {
            btnHangup.innerHTML = '切断';
            btnHold.hidden = false;
          } else if (status === 'COMPLETED') {
            resetUI();
          }
        });

        client.on('callHangup', (callId, callQuality, reason) => {
          console.log(`🐞 [Event] callHangup: reason=${reason}`);
          resetUI();
        });

        client.on('callInvite', async (callId) => {
          console.log(`🐞 [Event] callInvite! callId:`, callId);
          currentCall = callId;
          btnCall.hidden = true;
          btnInvite.disabled = false;
          btnInvite.hidden = false;
          try {
            ringtone.loop = true;
            await ringtone.play();
          } catch (e) {
            console.warn("⚠️ Audio play blocked:", e.message);
          }
        });

        client.on('callInviteCancel', (callId) => {
          console.log(`🐞 [Event] callInviteCancel: ${callId}`);
          resetUI();
        });

        console.log("🐞 Creating session...");
        await client.createSession(jwt);
        console.log(`✅ Session created!`);
        
      } catch (error) {
        console.error(`❌ Initialization Error:`, error);
        alert(`初期化エラー: ${error.message}`);
      }
    };

    function resetUI() {
      if (phone) btnCall.hidden = false;
      btnCall.disabled = false;
      btnCall.innerHTML = '発信';
      btnInvite.hidden = true;
      btnHangup.hidden = true;
      btnHangup.innerHTML = '切断';
      btnHold.hidden = true;
      btnHold.innerHTML = '保留';
      btnHold.classList.replace('bg-yellow-400', 'bg-gray-400');
      inputTransfer.hidden = true;
      btnTransfer.hidden = true;
      ringtone.pause();
      ringtone.currentTime = 0;
    }

    async function phoneCall() {
      try {
        btnCall.disabled = true;
        btnCall.innerHTML = '準備中...';
        const callId = await client.serverCall({ to: phone });
        currentCall = callId;
        console.log('🐞 outbound call started:', callId);
      } catch (error) {
        btnCall.disabled = false;
        btnCall.innerHTML = '発信';
        console.error(`🐞 Error: ${error.message}`);
      }
    }

    async function invite() {
      try {
        btnInvite.disabled = true;
        btnInvite.innerHTML = '応答中...';
        ringtone.pause();
        ringtone.currentTime = 0;
        await client.answer(currentCall);
        console.log('Call answered');
        btnInvite.hidden = true;
        btnHangup.hidden = false;
        btnHold.hidden = false;
      } catch (error) {
        console.error(`🐞 Error: ${error.message}`);
        btnInvite.disabled = false;
        btnInvite.hidden = true;
      }
    }

    async function hangup() {
      try {
        btnHangup.disabled = true;
        btnHangup.innerHTML = '切断中...';
        await client.hangup(currentCall);
        console.log('Call ended');
        resetUI();
      } catch (error) {
        console.error(`🐞 Error: ${error.message}`);
        btnHangup.disabled = false;
        btnHangup.innerHTML = '切断';
      }
    }

    async function toggleHold() {
        const isHolding = btnHold.innerHTML === '再開';
        const action = isHolding ? 'unhold' : 'hold';

        try {
            console.log(`🐞 toggleHold: currentCall=${currentCall}, currentLegId=${currentLegId}, userId=${userId}`);
            
            if (client.session && client.session.legs) {
                const legs = Object.keys(client.session.legs);
                if (legs.length > 0 && (!currentLegId || !client.session.legs[currentLegId])) {
                    currentLegId = legs[0];
                }
            }

            const body = {
                conversation_uuid: currentCall, 
                leg_id: currentLegId,
                operator_user_id: userId,
                action: action
            };

            const response = await fetch('./hold', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (response.ok) {
                if (isHolding) {
                    btnHold.innerHTML = '保留';
                    btnHold.classList.replace('bg-yellow-400', 'bg-gray-400');
                    inputTransfer.hidden = true;
                    btnTransfer.hidden = true;
                } else {
                    btnHold.innerHTML = '再開';
                    btnHold.classList.replace('bg-gray-400', 'bg-yellow-400');
                    inputTransfer.hidden = false;
                    btnTransfer.hidden = false;
                }
            } else {
                const errText = await response.text();
                alert('保留操作に失敗しました: ' + errText);
            }
        } catch (e) {
            console.error(e);
            alert('通信エラーが発生しました');
        }
    }

    async function transferCall() {
        const destination = inputTransfer.value;
        if (!destination || !confirm(`${destination} へ転送しますか？`)) return;

        try {
            const body = {
                conversation_uuid: currentCall,
                leg_id: currentLegId,
                destination_number: destination,
                operator_user_id: userId
            };

            const response = await fetch('./transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                alert('転送に失敗しました');
            }
        } catch (e) {
            console.error(e);
            alert('転送エラー');
        }
    }
  </script>
</head>
<body class="center bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg flex flex-col items-center gap-6">
    <h1 class="text-2xl font-bold text-gray-800">Call Center</h1>
    <div class="flex flex-wrap justify-center gap-4">
  	    <button id="btnCall" class="text-white font-bold bg-blue-500 hover:bg-blue-600 p-4 rounded-lg shadow transition-all duration-200" hidden onclick="phoneCall()">発信</button>
  	    <button id="btnInvite" class="text-white font-bold bg-red-500 hover:bg-red-600 p-4 rounded-lg shadow animate-pulse" hidden onclick="invite()">着信に応答</button>
  	    <button id="btnHangup" class="text-white font-bold bg-red-500 hover:bg-red-600 p-4 rounded-lg shadow transition-all duration-200" hidden onclick="hangup()">切断</button>
        <button id="btnHold" class="text-white font-bold bg-gray-400 hover:bg-gray-500 p-4 rounded-lg shadow transition-all duration-200" hidden onclick="toggleHold()">保留</button>
        <div class="flex flex-col gap-2">
            <input id="inputTransfer" type="text" class="border-2 border-gray-300 p-4 rounded-lg focus:border-green-500 outline-none transition-all duration-200" placeholder="転送先番号" hidden />
            <button id="btnTransfer" class="text-white font-bold bg-green-500 hover:bg-green-600 p-4 rounded-lg shadow transition-all duration-200" hidden onclick="transferCall()">転送実行</button>
        </div>
    </div>
  </div>
</body>
</html>
